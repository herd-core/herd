syntax = "proto3";
package herd.v1;

option go_package = "github.com/herd-core/herd/internal/proto/v1;herdv1";

service HerdControlPlane {
  rpc Connect(stream NodeStream) returns (stream CloudCommand);
}

message NodeStream {
  oneof payload {
    Heartbeat heartbeat = 1;
    CommandResponse command_response = 2;
  }
}

message Heartbeat {
  int64 available_memory_mb = 1;
  int32 active_vm_count = 2;
  double cpu_usage_percent = 3;
  int64 uptime_seconds = 4;
  string interface_ip = 5;
  repeated SessionInfo active_sessions = 6;
  int64 total_memory_mb = 7;
  int32 total_vcpu = 8;
}

message CommandResponse {
  string command_id = 1;
  string session_id = 2;
  string error = 3;
}

message SessionInfo {
  string session_id = 1;
  repeated PortMapping mappings = 2;
}

message PortMapping {
  int32 internal_port = 1;
  int32 host_port = 2;
}

message CloudCommand {
  string command_id = 1;
  string action = 2;           // "boot_vm", "destroy_vm", etc.
  map<string, string> params = 3;
  string requested_session_id = 4; // Top-Down ID from Control Plane
  repeated PortMapping requested_mappings = 5;
}
